# Does the projection actually predict anything? The gate before building
# anything on top of it.
#
# No terminal needed: Actions tab -> "model grade" -> "Run workflow".
# Reads the cache already committed in data/ and cannot touch the published
# page.
#
# WHAT TO READ IN THE OUTPUT
# --------------------------
# Three rows per stat, and only the comparison between them means anything:
#
#   league   every player gets his position's average rate. The floor. If
#            nothing beats this, the stat is a position label with extra steps.
#   own      the player's own simple career average. THIS is the number to
#            beat, because it is what anyone could compute in a spreadsheet.
#   model    the shipped estimator - shrunk, exponentially weighted.
#
# The last line of each block says how much `model` beats `own` by, as a
# percentage of mean absolute error. For shots on goal:
#
#   clearly POSITIVE   the projection knows something a simple average does
#                      not, and an edge column built on it is worth having.
#   around ZERO        the shrinkage is costing about what it saves. An edge
#                      column would be dressing up a career average.
#   NEGATIVE           the shrinkage is actively hurting; fix the model before
#                      building anything that consumes it.
#
# Nothing here is fitted, so there is nothing to overfit - every rate is built
# from that player's EARLIER games only, and every stat is projected onto the
# ACTUAL ice time of the game being graded so the rate is graded apart from
# the deployment.
name: model grade

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "cached seasons to read"
        default: "2025,2026"
      stat:
        description: "one stat, or leave blank to grade all of them"
        default: "sog"

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Fifteen cases whose answers are known, pointed at the estimators
      # below BEFORE they are pointed at real data. Among them: that the
      # opponent factor adds nothing on a league where no team defends
      # differently and recovers a real share of one where they do, that the
      # Poisson tail function matches draws from a known rate, and - the one
      # that matters most here - that the betting test CATCHES a model whose
      # projections are 25% too high rather than printing it a happy ROI.
      # If any of that fails, every number below is worthless and the job
      # stops here.
      - name: check the instruments
        run: python validate.py --squeeze-self-test

      - name: grade the RATE (projected onto actual ice time)
        run: |
          ARGS="--seasons ${{ inputs.seasons }}"
          if [ -n "${{ inputs.stat }}" ]; then ARGS="$ARGS --stat ${{ inputs.stat }}"; fi
          python validate.py $ARGS | tee rate.txt

      # The one that decides whether an edge column is worth building. The
      # rate grade above flatters the model by handing it the real minutes
      # and ignoring the opponent and home factors entirely. This runs the
      # WHOLE shipped number against a player's own average shots per game,
      # and then tests whether its probabilities clear the -110 vig.
      - name: grade the WHOLE projection, and test it against the vig
        run: |
          # The default is applied by BASH, on the next two lines, and NOT
          # inside a GitHub expression. GitHub has no shell-style default
          # form, and - this is the part that bit - it parses its expression
          # syntax everywhere in the file INCLUDING inside shell comments, so
          # a comment that merely quoted the broken form was itself a parse
          # error. Do not write that syntax here even to explain it.
          STAT="${{ inputs.stat }}"
          python validate.py --full \
            --seasons "${{ inputs.seasons }}" \
            --stat "${STAT:-sog}" | tee full.txt
          {
            echo '## Model grade'
            echo '### The rate alone, on actual ice time'
            echo '```'; cat rate.txt; echo '```'
            echo '### The whole shipped projection, and the betting test'
            echo '```'; cat full.txt; echo '```'
            echo 'Read the betting table, not the MAE table. MAE is nearly'
            echo 'blind to the opponent factor; the claimed-versus-actual hit'
            echo 'rate is not, and it is what a prop pays out on.'
          } >> $GITHUB_STEP_SUMMARY
