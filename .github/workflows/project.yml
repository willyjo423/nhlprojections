name: Project tonight

on:
  schedule:
    # 15:31 UTC is late morning in North America - well before any puck drop,
    # and off the hour because :00 is when every cron on GitHub fires at once
    # and schedules get delayed.
    - cron: "31 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD (blank = today)"
        default: ""
      games:
        description: 'skip the schedule call, e.g. "TOR@MTL,EDM@CGY"'
        default: ""
      seasons:
        description: "seasons to read from the cache"
        default: "2025,2026"

permissions:
  contents: write

# Shares a lock with "Fetch history": both push to main, and the fetch runs
# two hours earlier so the projection reads a history that already includes
# last night.
concurrency:
  group: nhl-data
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Every import resolves
        run: python -c "import source, fetch, model, slate, project, validate"

      - name: Tests
        # These need no network and no cache, and they are the only thing
        # standing between a units bug and a page full of confident nonsense.
        run: |
          set -o pipefail
          python tests.py

      - name: The history cache is present
        # Without this the projection step would quietly start fetching a
        # thousand players inside a job with a thirty minute limit, and fail
        # at minute thirty with a timeout that explains nothing.
        run: |
          set -e
          if ! ls data/skaters_*.csv.gz >/dev/null 2>&1; then
            echo "::error::No history cache in data/. Run the 'Fetch history'"
            echo "::error::workflow once before this one."
            exit 1
          fi
          ls -la data/

      - name: How old is the history
        # Says it out loud every run. A page built from a frozen cache is
        # indistinguishable from one built from a current cache - same layout,
        # same plausible numbers, same "generated this morning" in the footer.
        run: python cache_age.py --max-age 4

      - name: Project
        # Inputs go through the ENVIRONMENT, not through string interpolation
        # into the command line. `${{ inputs.games }}` pasted straight into a
        # shell is an injection point, and it also breaks on any input
        # containing a quote.
        env:
          SEASONS: ${{ inputs.seasons }}
          DAY: ${{ inputs.date }}
          GAMES: ${{ inputs.games }}
        run: |
          set -o pipefail
          args=(--seasons "${SEASONS:-2025,2026}")
          [ -n "$DAY" ] && args+=(--date "$DAY")
          [ -n "$GAMES" ] && args+=(--games "$GAMES")
          python project.py "${args[@]}"

      - name: Commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/ as well as docs/data. If the projection run had to fetch a
          # season the cache was missing, that download cost ten minutes and
          # would otherwise be thrown away and repeated every single morning.
          git add -f docs/data data
          git commit -m "projections $(date -u +%Y-%m-%d)" || {
            echo "nothing changed"; exit 0; }
          git pull --rebase --autostash origin main
          git push
